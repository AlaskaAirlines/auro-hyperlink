<!-- Web component example -->
A link with an <code>http://</code> address: <auro-hyperlink href="http://www.alaskaair.com/route-map">route map</auro-hyperlink>.
A link with an address that starts with <code>//</code>: <auro-hyperlink href="//www.alaskaair.com/route-map">route map</auro-hyperlink>.

<!-- Output code in shadow DOM element -->
A link with an <code>http://</code> address: <a part="link" class="hyperlink" href="https://www.alaskaair.com/route-map"><slot></slot></a>.
A link with an address that starts with <code>//</code>: <a part="link" class="hyperlink" href="https://www.alaskaair.com/route-map"><slot></slot></a>.
